# Publishes the MapLibre demo (docs/) plus the sprite, SVG and style assets to GitHub Pages.
# Enable once: Settings → Pages → Build and deployment → Source: "GitHub Actions".
#
# Nothing here names the repository owner: the site URL comes from GitHub (configure-pages),
# so the workflow keeps working after the repository is transferred or renamed, or given a
# custom domain.
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}   # the site root redirects to v3/
    steps:
      - uses: actions/checkout@v4
      - id: pages
        uses: actions/configure-pages@v5
      - name: Point SLDs, QGIS linked library and manifest at this site, then assemble
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          python3 tools/make_web_styles.py . --base-url "${SITE_URL%/}/v3"
          tools/assemble_site.sh _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
