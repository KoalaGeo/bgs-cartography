# Builds the nginx symbology image and pushes it to GitHub Container Registry.
# Set the repository variable SYMBOLOGY_BASE_URL to the public URL of the v3 folder,
# e.g. https://symbology.example.org/symbology/v3 (Settings → Secrets and variables → Actions → Variables).
name: Build serving image

# Runs on release tags or by hand only, so ordinary pushes do not publish a package.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=sha
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: serve/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_URL=${{ vars.SYMBOLOGY_BASE_URL || 'http://localhost:8080/symbology/v3' }}
