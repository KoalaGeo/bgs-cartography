# Static hosting for the BGS cartographic symbology.
# Content lives under /usr/share/nginx/html/symbology/ (see scripts/assemble_site.sh).
# Designed for nginxinc/nginx-unprivileged (non-root, port 8080) behind an ingress.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types image/svg+xml application/json application/geo+json text/csv
               application/xml application/vnd.ogc.sld+xml text/css application/javascript;

    # Cache-Control is added without 'always' so errors (404 etc.) are not cached
    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    location = /         { return 302 /symbology/v3/; }
    location = /symbology { return 302 /symbology/v3/; }

    location /symbology/ {
        include /etc/nginx/snippets/symbology-headers.conf;
        add_header Cache-Control "public, max-age=300";     # html, json, catalogues
        try_files $uri $uri/ =404;

        # Images: the v3 path is stable, but assets can still receive fixes, so one day not "immutable"
        location ~* \.(svg|png)$ {
            include /etc/nginx/snippets/symbology-headers.conf;
            add_header Cache-Control "public, max-age=86400";
        }
        # Types missing from the stock mime.types
        location ~* \.geojson$ {
            types { } default_type application/geo+json;
            include /etc/nginx/snippets/symbology-headers.conf;
            add_header Cache-Control "public, max-age=300";
        }
        location ~* \.csv$ {
            types { } default_type text/csv;
            charset utf-8; charset_types text/csv;
            include /etc/nginx/snippets/symbology-headers.conf;
            add_header Cache-Control "public, max-age=300";
        }
        location ~* \.sld$ {
            types { } default_type application/vnd.ogc.sld+xml;
            include /etc/nginx/snippets/symbology-headers.conf;
            add_header Cache-Control "public, max-age=300";
        }
        location ~* \.qml$ {
            types { } default_type application/xml;
            include /etc/nginx/snippets/symbology-headers.conf;
            add_header Cache-Control "public, max-age=300";
        }
    }
}
