# Shared response headers for every location (nginx drops parent add_header
# directives as soon as a location declares its own, so each location includes this).
add_header Access-Control-Allow-Origin "*" always;
add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
add_header Access-Control-Allow-Headers "Range, If-None-Match, If-Modified-Since" always;
add_header Access-Control-Expose-Headers "ETag, Content-Length, Content-Range" always;
add_header X-Content-Type-Options "nosniff" always;
if ($request_method = OPTIONS) { return 204; }
