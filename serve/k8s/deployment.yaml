apiVersion: apps/v1
kind: Deployment
metadata:
  name: bgs-symbology
  labels: { app.kubernetes.io/name: bgs-symbology }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: bgs-symbology }
  template:
    metadata:
      labels: { app.kubernetes.io/name: bgs-symbology }
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: nginx
          image: ghcr.io/OWNER/REPO:latest   # set by kustomization.yaml
          ports: [{ name: http, containerPort: 8080 }]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }          # nginx-unprivileged writes pid/cache here
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 30
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
      volumes:
        - name: tmp
          emptyDir: {}
